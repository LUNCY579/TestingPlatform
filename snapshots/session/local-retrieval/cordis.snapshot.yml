# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: retrieval-embed
  disabled: false
  config:
    provider: local-hashed
    model: dsh-hashed-v1
    dimension: 64

- id: retrieval-zvec
  disabled: false
  config:
    indexDir: !!js dshHomePath('retrieval')
    queryThreads: 1
    optimizeThreads: 1
    acceleratorEnabled: false

- id: retrieval
  disabled: false
  config:
    enabled: true
    persistentMemory: false
    crossSessionRead: false
    useAccelerator: false

- id: retrieval-indexing
  disabled: false
  config:
    roots: !!js '[process.cwd()]'
    statePath: !!js dshHomePath('retrieval/index-state.json')
    excludedDirectories: [.git, node_modules, .testingplatform, .dsh, .snapshot-patches]
    extensions: [ts]

- id: retrieval-tools
  disabled: false
  config:
    localPrincipal: synthetic-snapshot-operator
    autoRetrieval: false
