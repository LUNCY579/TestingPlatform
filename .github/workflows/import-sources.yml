name: Import combined sources

on:
  push:
    branches: [main]
    paths:
      - '.testingplatform-import/ready.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testing-platform-initial-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'LUNCY579/TestingPlatform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Import pinned sources and verified integration files
        env:
          EXPECTED_IMPORT_HEAD: ${{ github.sha }}
        run: python3 testing-platform/import-sources.py --expected-head "$EXPECTED_IMPORT_HEAD" --publish
