name: TestingPlatform checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-platform-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build harness and check TypeScript
        run: pnpm run setup
      - name: Check plugin adapter types
        run: pnpm --dir plugins/dsh-our-free-model run typecheck
      - name: Run plugin offline regressions
        run: pnpm --dir plugins/dsh-our-free-model run test:contributor
      - name: Test repository integration
        run: pnpm run test:integration
      - name: Smoke test the combined Web application
        run: pnpm run smoke:platform
